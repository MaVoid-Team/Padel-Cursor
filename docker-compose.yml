services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: padel-postgres
    environment:
      POSTGRES_DB: padel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0sK7Ic]b94
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padel-network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padel-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: padel_booking
      DB_USER: postgres
      DB_PASSWORD: 0sK7Ic]b94
      JWT_SECRET: df48245c5ba1acf566b095282861129a
      NODE_ENV: production
      PAYMOB_API_KEY: "ZXlKaGJHY2lPaUpJVXpVeE1pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SmpiR0Z6Y3lJNklrMWxjbU5vWVc1MElpd2ljSEp2Wm1sc1pWOXdheUk2TVRBd01UQXhOaXdpYm1GdFpTSTZJbWx1YVhScFlXd2lmUS5oUzdzeEQyb0tCMmxvc2Z3Y0NWMUhpY2R2bUpQT1otUE5xZHdncW54Wkp0bnp6bnlOZmp2RkdPSjluYi1RSXZoMVJNcGl1WGYwUXEwdzNVR2NoSFVodw=="
      PAYMOB_SECRET_KEY: "egy_sk_live_706fccc91d8f2d3ad42fd61b28dd99f550f435318c0c57cf3bb55dc849d9b9b0"
      PAYMOB_PUBLIC_KEY: "egy_pk_live_mPI3bAsuoEjeZDcqNfWotMc6KcDIUga1"
      PAYMOB_INTEGRATION_ID: 5261462
      PAYMOB_INTEGRATION_ID_WALLET: 5261461
      PAYMOB_IFRAME_ID: 875103
      PAYMOB_HMAC_SECRET: 9D9B6EACB69C3045F83B17E5F1D6DC60
    ports:
      - "3581:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - padel-network

  # Frontend (Nginx serving static files + proxying API)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padel-frontend
    ports:
      - "8418:80"
    depends_on:
      - backend
    networks:
      - padel-network

volumes:
  postgres_data:

networks:
  padel-network:
    driver: bridge
