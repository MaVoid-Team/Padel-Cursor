services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: padel-postgres
    environment:
      POSTGRES_DB: padel_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0sK7Ic]b94
    ports:
      - "5499:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - padel-network

  # Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: padel-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: padel_booking
      DB_USER: postgres
      DB_PASSWORD: 0sK7Ic]b94
      JWT_SECRET: df48245c5ba1acf566b095282861129a
      NODE_ENV: production
    ports:
      - "3581:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - padel-network

  # Frontend (Nginx serving static files + proxying API)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padel-frontend
    ports:
      - "8418:80"
    depends_on:
      - backend
    networks:
      - padel-network

volumes:
  postgres_data:

networks:
  padel-network:
    driver: bridge
